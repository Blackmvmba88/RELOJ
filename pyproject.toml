[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reloj-core"
version = "0.1.0"
description = "Deterministic parametric watch specification and validation engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlackMamba Corp" }]
dependencies = []

[project.scripts]
reloj = "reloj_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
